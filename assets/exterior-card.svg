<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#skyGrad)" rx="16" />
  <!-- Sun & weather shield -->
  <circle cx="340" cy="60" r="35" fill="#F59E0B" opacity="0.85" />
  <circle cx="340" cy="60" r="45" fill="#FDE68A" opacity="0.3" />
  <!-- Rain cloud & rain drops showing resistance -->
  <g transform="translate(40, 30)">
    <path d="M20,40 Q20,20 40,20 Q50,5 70,15 Q90,5 105,25 Q125,25 125,45 Q125,55 105,55 L25,55 Q15,55 20,40 Z" fill="#94A3B8" opacity="0.7" />
    <line x1="35" y1="65" x2="30" y2="85" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
    <line x1="65" y1="65" x2="60" y2="85" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
    <line x1="95" y1="65" x2="90" y2="85" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
  </g>
  <!-- Modern House Exterior -->
  <polygon points="120,130 200,70 280,130" fill="url(#roofGrad)" />
  <rect x="130" y="130" width="140" height="130" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
  <!-- Accent wall color -->
  <rect x="200" y="130" width="70" height="130" fill="#F59E0B" opacity="0.2" />
  <!-- Door -->
  <rect x="180" y="180" width="40" height="80" rx="4" fill="#0F172A" />
  <circle cx="210" cy="225" r="3" fill="#F59E0B" />
  <!-- Windows -->
  <rect x="145" y="150" width="35" height="35" rx="3" fill="#38BDF8" opacity="0.7" />
  <rect x="220" y="150" width="35" height="35" rx="3" fill="#38BDF8" opacity="0.7" />
  <!-- Shield Badge -->
  <g transform="translate(290, 180)">
    <path d="M30,5 L55,15 L55,45 Q55,75 30,90 Q5,75 5,45 L5,15 Z" fill="#10B981" />
    <path d="M20,45 L28,53 L42,35" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <!-- Ground -->
  <rect x="0" y="260" width="400" height="40" fill="#E2E8F0" />
</svg>
