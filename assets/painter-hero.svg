<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <linearGradient id="rollerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="paintStreak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>
  <!-- Background organic shape -->
  <path d="M50,80 Q250,20 480,90 T540,380 Q320,490 120,420 T50,80 Z" fill="url(#bgGrad)" opacity="0.6" />
  <circle cx="420" cy="120" r="80" fill="#FDE047" opacity="0.4" />
  <!-- Wall swath -->
  <path d="M120,60 L380,60 Q400,60 400,80 L400,320 Q320,380 200,360 L120,320 Z" fill="url(#paintStreak)" opacity="0.15" />
  <!-- Paint can -->
  <g transform="translate(80, 240)">
    <ellipse cx="80" cy="200" rx="60" ry="16" fill="#CBD5E1" />
    <path d="M20,110 L20,200 Q80,225 140,200 L140,110 Z" fill="#0F172A" />
    <ellipse cx="80" cy="110" rx="60" ry="16" fill="#F59E0B" />
    <rect x="30" y="135" width="100" height="45" rx="6" fill="#FFFFFF" />
    <rect x="40" y="145" width="80" height="8" rx="3" fill="#0284C7" />
    <rect x="40" y="160" width="50" height="6" rx="2" fill="#64748B" />
    <!-- Handle -->
    <path d="M10,120 Q80,30 150,120" fill="none" stroke="#94A3B8" stroke-width="4" />
    <!-- Paint drip -->
    <path d="M110,115 Q115,150 125,145 Q135,130 135,115 Z" fill="#F59E0B" />
  </g>
  <!-- Paint Roller -->
  <g transform="translate(250, 70)">
    <!-- Roller cylinder -->
    <rect x="80" y="40" width="160" height="60" rx="14" fill="url(#rollerGrad)" />
    <!-- Texture marks -->
    <line x1="100" y1="50" x2="100" y2="90" stroke="#BAE6FD" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <line x1="130" y1="50" x2="130" y2="90" stroke="#BAE6FD" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <line x1="160" y1="50" x2="160" y2="90" stroke="#BAE6FD" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <line x1="190" y1="50" x2="190" y2="90" stroke="#BAE6FD" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <line x1="220" y1="50" x2="220" y2="90" stroke="#BAE6FD" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <!-- Metal arm -->
    <path d="M240,70 L260,70 L260,170 L170,170 L170,240" fill="none" stroke="#64748B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Handle -->
    <rect x="158" y="235" width="24" height="90" rx="6" fill="#F59E0B" />
    <rect x="155" y="315" width="30" height="15" rx="4" fill="#D97706" />
    <!-- Fresh wet paint swath behind roller -->
    <path d="M80,40 L-20,40 L-20,-10 L80,-10 Z" fill="#38BDF8" opacity="0.25" />
  </g>
  <!-- Paint splashes / dots -->
  <circle cx="490" cy="240" r="14" fill="#EC4899" />
  <circle cx="520" cy="220" r="7" fill="#EC4899" />
  <circle cx="470" cy="270" r="8" fill="#F59E0B" />
  <circle cx="140" cy="180" r="12" fill="#0284C7" />
  <circle cx="120" cy="210" r="6" fill="#0284C7" />
</svg>
