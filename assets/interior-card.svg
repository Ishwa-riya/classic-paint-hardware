  <path d="M60,240 L64,200 L76,200 L80,240 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2" />
  <path d="M70,200 Q50,160 30,170 Q60,180 70,200" fill="#10B981" />
