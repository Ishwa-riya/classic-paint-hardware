<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="wpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFEFF" />
      <stop offset="100%" stop-color="#CFFAFE" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#wpBg)" rx="16" />
  <!-- Protective barrier shield -->
  <path d="M200,40 L300,80 L300,180 Q300,240 200,270 Q100,240 100,180 L100,80 Z" fill="#0284C7" opacity="0.1" />
  <path d="M200,55 L285,90 L285,175 Q285,225 200,250 Q115,225 115,175 L115,90 Z" fill="#FFFFFF" stroke="#0284C7" stroke-width="4" />
  <!-- Water drop on top of barrier -->
  <path d="M200,90 Q170,140 170,170 A30,30 0 0,0 230,170 Q230,140 200,90 Z" fill="url(#dropGrad)" />
  <circle cx="190" cy="155" r="5" fill="#FFFFFF" opacity="0.6" />
  <!-- Deflection ripples -->
  <path d="M150,210 Q200,230 250,210" stroke="#06B6D4" stroke-width="4" fill="none" stroke-linecap="round" />
  <path d="M135,225 Q200,248 265,225" stroke="#06B6D4" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6" />
  <!-- Small droplets bouncing off -->
  <circle cx="130" cy="120" r="8" fill="#38BDF8" />
  <circle cx="270" cy="115" r="10" fill="#38BDF8" />
</svg>
