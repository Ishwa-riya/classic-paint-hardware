<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="toolsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#toolsBg)" rx="16" />
  <!-- Paint brush -->
  <g transform="translate(70, 40) rotate(-25)">
    <rect x="30" y="20" width="40" height="60" rx="4" fill="#F59E0B" />
    <rect x="25" y="80" width="50" height="20" rx="2" fill="#94A3B8" />
    <path d="M25,100 L25,160 Q50,175 75,160 L75,100 Z" fill="#334155" />
    <line x1="40" y1="120" x2="40" y2="150" stroke="#0284C7" stroke-width="3" />
    <line x1="50" y1="120" x2="50" y2="155" stroke="#EC4899" stroke-width="3" />
    <line x1="60" y1="120" x2="60" y2="148" stroke="#F59E0B" stroke-width="3" />
  </g>
  <!-- Roller -->
  <g transform="translate(180, 50)">
    <rect x="40" y="20" width="100" height="40" rx="8" fill="#0284C7" />
    <path d="M140,40 L160,40 L160,110 L100,110 L100,160" fill="none" stroke="#64748B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="92" y="160" width="16" height="50" rx="4" fill="#0F172A" />
  </g>
  <!-- Wrench & Hardware Fasteners -->
  <g transform="translate(260, 160)">
    <!-- Wrench -->
    <path d="M20,60 L70,10 L85,25 L35,75 Z" fill="#64748B" />
    <circle cx="20" cy="70" r="14" fill="#475569" />
    <!-- Screws & Bolts -->
    <circle cx="20" cy="20" r="12" fill="#94A3B8" />
    <line x1="12" y1="20" x2="28" y2="20" stroke="#334155" stroke-width="3" />
    <line x1="20" y1="12" x2="20" y2="28" stroke="#334155" stroke-width="3" />
    <circle cx="60" cy="90" r="9" fill="#94A3B8" />
    <line x1="54" y1="90" x2="66" y2="90" stroke="#334155" stroke-width="2.5" />
  </g>
  <!-- Trowel / Putty blade -->
  <g transform="translate(80, 180) rotate(15)">
    <polygon points="10,40 70,10 80,60 20,70" fill="#CBD5E1" stroke="#94A3B8" stroke-width="2" />
    <rect x="40" y="55" width="12" height="35" rx="3" fill="#D97706" />
  </g>
</svg>
